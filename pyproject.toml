[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "career-rag-lab"
version = "0.1.0"
description = "A learning project for building and evaluating a career-focused RAG pipeline."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1.0",
    "langchain-text-splitters>=1.1.2,<1.2",
    "openai>=2.0,<3.0",
    "python-dotenv>=1.2,<2.0",
    "qdrant-client>=1.15,<1.16",
    "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1.0",
    "pytest>=8.4,<9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running local service",
    "live_api: calls a paid external API",
]

